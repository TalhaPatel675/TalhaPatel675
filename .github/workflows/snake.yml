name: Generate Snake

# Builds the contribution-snake animation and commits it to the `output`
# branch, where GitHub serves it directly (no third-party proxy timeout).

on:
  schedule:
    - cron: "18 2 * * *"      # refresh once a day (02:18 UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # required so the action can push to `output`
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Sky snake on a navy->sky dot gradient (0 = empty ... 4 = most commits)
          outputs: |
            dist/github-snake-dark.svg?color_snake=#7dd3fc&color_dots=#161b22,#0c4a6e,#0369a1,#0284c7,#7dd3fc

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
